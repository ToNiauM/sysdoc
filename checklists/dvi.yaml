  - id: DVI-AMB-018
    aplicabilidade: ambos
    peca: TR
    documento_saida: TR
    tipo: julgamento
    pergunta: >-
      Os índices de reajuste estão indicados corretamente (data-base,
      periodicidade e legislação aplicável), sem dispensa indevida da
      cláusula de reajuste sob a justificativa de vigência contratual
      inferior a 12 meses?
    base_legal_texto: >-
      "Verifique se os índices de reajuste estão indicados corretamente,
      observando a data-base vinculada ao orçamento estimado, a
      periodicidade e a legislação aplicável. Nunca aponte a dispensa ou
      inaplicabilidade de cláusula de reajuste sob a justificativa de que a
      vigência do contrato é inferior a 12 meses (atente-se ao Art. 25, §
      7º da Lei 14.133/21). O reajuste deve ser previsto em todos os
      casos." (idêntica em dvi_geral.md, TERMO DE REFERÊNCIA §13, e
      dvi_tic.md, TERMO DE REFERÊNCIA §8).
    referencia: "Lei 14.133/2021"
    severidade_default: alta
    modelo_alvo: forte
    ativo: true
    parametros: {}

