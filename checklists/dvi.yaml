  - id: DVI-AMB-013
    aplicabilidade: ambos
    peca: TR
    documento_saida: TR
    tipo: julgamento
    pergunta: >-
      A garantia contratual, quando aplicável, observa o limite de 5% do
      valor anual do contrato, inclusive em contratos plurianuais, e — em
      serviços de engenharia — o TR contempla a garantia adicional do
      licitante vencedor cuja proposta for inferior a 85% do valor orçado
      pela Administração?
    base_legal_texto: >-
      "a) Garantia contratual: verifique a previsão, quando aplicável, dos
      tipos aceitos e percentuais, observando o limite de 5% do valor anual
      do contrato, inclusive nos contratos de vigência plurianual. b)
      Garantia adicional: em se tratando de serviços de engenharia, o TR
      deve contemplar a garantia adicional do licitante vencedor cuja
      proposta for inferior a 85% do valor orçado pela Administração (art.
      59, § 5º, da Lei nº 14.133/2021)." (dvi_geral.md e dvi_tic.md, seção
      "Garantia Contratual e Garantia Adicional", conteúdo idêntico).
