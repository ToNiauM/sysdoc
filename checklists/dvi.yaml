versao: "1.1"
descricao: >-
  Checklist DVI (Documento de Verificação Inicial) — conversão completa
  dos dois prompts DVI monolíticos (`referencias/prompts-dvi/dvi_geral.md` e
  `referencias/prompts-dvi/dvi_tic.md`, insumo do dono do produto) em itens
  tipados, cobrindo os cinco tipos de verificação (presenca, julgamento,
  calculo, vigencia, mecanica) e as três aplicabilidades (geral, tic, ambos).
  Itens presentes com o mesmo conteúdo substantivo nos dois prompts entram
  como aplicabilidade "ambos" (DVI-AMB-*), nunca duplicados. Itens com base
  legal ainda não transcrita literalmente no prompt-fonte entram como
  ativo: false e base_legal_texto: pendente (nunca artigo/inciso inventado,
  conforme CLAUDE.md). As seções "RESULTADO" (formato de relatório) dos
  prompts-fonte não viram itens — já são atendidas pela síntese existente
  (sysdoc_dvi/sintese.py). A instrução de "eliminar os indícios de texto
  feito por IA" dos prompts-fonte NÃO foi implementada: o SysDoc registra
  deliberadamente `modelo_ia` nos metadados do JSON (exigido pelo validador)
  e o DVI é uma minuta assistida por IA para revisão humana — escrita em
  norma culta natural, sem ocultação de autoria (ver SUMMARY do plano
  05-13). A observação "Se tiver algum DVI ao final do processo,
  desconsidere" é orientação de mapeamento de peças, não um item de
  checklist.
atualizado_em: "2026-08-26"

itens:
  - id: DVI-AMB-001
    aplicabilidade: ambos
    peca: ETP
    tipo: presenca
    pergunta: >-
      O ETP descreve a necessidade da contratação, considerado o problema a
      ser resolvido sob a perspectiva do interesse público?
    base_legal_texto: pendente
    referencia: "Lei 14.133/2021, art. 18, §1º, I"
    severidade_default: média
    modelo_alvo: economico
    ativo: false
    parametros: {}

  - id: DVI-AMB-002
    aplicabilidade: ambos
    peca: TR
    tipo: julgamento
    pergunta: >-
      O critério de julgamento adotado é adequado ao objeto, à modalidade e
      ao regime de execução escolhidos para a contratação?
    base_legal_texto: pendente
    referencia: "Lei 14.133/2021, critérios de julgamento do certame"
    severidade_default: alta
    modelo_alvo: forte
    ativo: false
    parametros: {}

  - id: DVI-AMB-003
    aplicabilidade: ambos
    peca: MCP
    documento_saida: ETP
    tipo: calculo
    pergunta: >-
      Os valores de média, mediana e o cálculo unitário × quantidade da
      pesquisa de preços conferem com os valores declarados no Mapa
      Comparativo de Preços?
    base_legal_texto: >-
      "Auditoria de Cálculos: Verifique, como se fosse um experiente
      matemático, a exatidão de todos os cálculos de média ou mediana
      usados para a estimativa de preços no MCP. Concluída a etapa 2, faça
      uma nova conferência de todos os cálculos, com o objetivo de eliminar
      erros." (seção MAPA COMPARATIVO DE PREÇOS, idêntica em dvi_geral.md e
      dvi_tic.md). A dupla conferência instruída no prompt-fonte é satisfeita
      pela natureza determinística e reprodutível do motor de cálculo
      (decimal.Decimal), que não depende de nova rodada de modelo.
    referencia: "IN SEGES/ME 65/2021"
    severidade_default: crítica
    modelo_alvo: economico
    ativo: true
    parametros:
      tolerancia_absoluta: 0.01

  - id: DVI-AMB-004
    aplicabilidade: ambos
    peca: PROCESSO
    documento_saida: TR
    tipo: vigencia
    pergunta: >-
      Os normativos citados no processo continuam vigentes, sem revogação ou
      substituição posterior não refletida no texto?
    base_legal_texto: >-
      "Antes, confirme se o(s) normativo(s) referenciado(s) segue(m)
      vigente(s); caso revogado(s) ou alterado(s), informe a(s) norma(s)
      vigente(s) aplicável(is)." (seção ESTUDO TÉCNICO PRELIMINAR, idêntica
      em dvi_geral.md e dvi_tic.md).
    referencia: "Padrão interno: lookup dinâmico na tabela curada de vigência normativa (RF7) — não é uma norma única fixa"
    severidade_default: alta
    modelo_alvo: economico
    ativo: true
    parametros: {}

