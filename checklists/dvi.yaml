      obra, regime de execução, vigência e modalidade contratual, e explica
      o custo global da solução no ciclo de vida do contrato?
    base_legal_texto: >-
      "Avalie se o ETP: Realiza análise de riscos que possam impactar a
      contratação; Justifica adequadamente a escolha de solução
      tecnológica, mão de obra, regime de execução, vigência e modalidade
      contratual; Explica o custo global da solução no ciclo de vida do
      contrato, especialmente em contratos de longa duração." (dvi_geral.md,
      ESTUDO TÉCNICO PRELIMINAR §4).
    referencia: "Padrão interno: análise de riscos e justificativas de solução do ETP"
    severidade_default: alta
    modelo_alvo: forte
    ativo: true
    parametros: {}

