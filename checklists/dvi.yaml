    tipo: presenca
    pergunta: >-
      O ETP contém o elemento do inciso II do art. 11 da IN SGD/ME 94/2022
      (análise comparativa de soluções, considerando aspecto econômico e
      aspectos qualitativos: necessidades similares em outros órgãos,
      alternativas de mercado, softwares da Portaria STI/MP 46/2016,
      políticas/padrões de governo — ePing, eMag, ePwg, Design System,
      ICP-Brasil, e-ARQ Brasil —, adequação do ambiente, modelos de
      prestação, tipos de solução, aquisição como bem ou serviço, ampliação
      ou substituição da solução implantada, e métricas de prestação e
      pagamento)?
