  - id: DVI-AMB-005
    aplicabilidade: ambos
    peca: ETP
    documento_saida: ETP
    tipo: calculo
    pergunta: >-
      Os cálculos de média, mediana, valores unitários e totais do ETP
      foram executados corretamente, com dados atualizados e coerentes com
      as fontes utilizadas e memória de cálculo suficiente para auditoria?
    base_legal_texto: >-
      "Verifique se: Todos os cálculos de média, mediana, valores unitários
      e totais foram executados corretamente; Os dados estão atualizados e
      coerentes com as fontes utilizadas (ex: SINAPI, CCT, Banco de Preços
      em Saúde, Painel de Preços, etc.); Há memória de cálculo suficiente
      para permitir auditoria; Os quantitativos estimados estão alinhados à
      real necessidade da Administração." (dvi_geral.md, ESTUDO TÉCNICO
      PRELIMINAR §3). O prompt TIC reitera de forma mais sucinta:
      "Auditoria de Cálculos: Verifique a exatidão de todos os cálculos de
      média ou mediana usados para a estimativa de preços no ETP."
      (dvi_tic.md, ESTUDO TÉCNICO PRELIMINAR §3).
    referencia: "IN SEGES/ME 65/2021"
    severidade_default: crítica
    modelo_alvo: economico
    ativo: true
    parametros:
      tolerancia_absoluta: 0.01

