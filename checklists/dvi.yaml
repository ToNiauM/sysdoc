      aspecto econômico, os aspectos qualitativos em termos de benefícios
      para o alcance dos objetivos da contratação, observando: a)
      necessidades similares em outros órgãos ou entidades da Administração
      Pública e as soluções adotadas; b) as alternativas do mercado; c) a
      existência de softwares disponíveis conforme descrito na Portaria
      STI/MP nº 46, de 28 de setembro de 2016, e suas atualizações; d) as
      políticas, os modelos e os padrões de governo, a exemplo dos Padrões
      de Interoperabilidade de Governo Eletrônico - ePing, Modelo de
      Acessibilidade em Governo Eletrônico - eMag, Padrões Web em Governo
      Eletrônico - ePwg, padrões de Design System de governo,
      Infraestrutura de Chaves Públicas Brasileira - ICP-Brasil e Modelo de
      Requisitos para Sistemas Informatizados de Gestão Arquivística de
      Documentos - e-ARQ Brasil, quando aplicáveis; e) as necessidades de
      adequação do ambiente do órgão ou entidade para viabilizar a execução
      contratual; f) os diferentes modelos de prestação do serviço; g) os
      diferentes tipos de soluções em termos de especificação, composição
      ou características dos bens e serviços integrantes; h) a
      possibilidade de aquisição na forma de bens ou contratação como
      serviço; i) a ampliação ou substituição da solução implantada; e j)
      as diferentes métricas de prestação do serviço e de pagamento;"
