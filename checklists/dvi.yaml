  - id: DVI-AMB-015
    aplicabilidade: ambos
    peca: TR
    documento_saida: TR
    tipo: julgamento
    pergunta: >-
      Quando previsto o Sistema de Registro de Preços, estão presentes as
      situações que autorizam sua adoção? Em caso de adesão a ata SRP, há
      justificativa de que a adesão não configura aquisição irregular de
      subconjunto de itens de grupo adjudicado por preço global, e o valor
      aderido corresponde ao menor lance ofertado na licitação?
    base_legal_texto: >-
      "a) Quando previsto o Sistema de Registro de Preços, verifique se
      estão presentes as situações que autorizam a sua adoção, nos termos
      do art. 3º do Decreto nº 11.462/2023. b) No caso de adesão a ata SRP:
      verifique se há justificativa evidenciando que a adesão não configura
      aquisição irregular de subconjunto de itens pertencentes a grupo
      adjudicado por preço global, especialmente em relação àqueles cujos
      preços unitários adjudicados ao vencedor do lote não correspondam ao
      menor preço válido apurado na disputa individual do item. Confirme se
      o valor aderido é, de fato, o menor lance ofertado na licitação,
      ainda que a adesão seja por grupo, nos termos do entendimento firmado
      pelo TCU no Acórdão nº 1.872/2018 (Plenário)." (dvi_geral.md, TERMO
      DE REFERÊNCIA §10; conteúdo repetido em dvi_tic.md, TERMO DE
