      de Padronização; locais de entrega e critérios de recebimento;
      garantias e manutenção/assistência técnica)?
    base_legal_texto: >-
      "I. Definição do objeto, incluindo: a) natureza, quantitativos, prazo
      contratual e possibilidade de prorrogação; b) especificação do
      bem/serviço, preferencialmente com base no Catálogo Eletrônico de
      Padronização (Portaria SEGES nº 938/2022), considerando requisitos de
      qualidade, rendimento, compatibilidade, durabilidade e segurança; c)
      locais de entrega e critérios para recebimento provisório e
      definitivo; d) garantias e condições de manutenção/assistência
      técnica, quando aplicável."
    referencia: "IN SEGES/ME 81/2022"
    severidade_default: média
    modelo_alvo: economico
