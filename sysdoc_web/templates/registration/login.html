{% extends "base.html" %}

{% block conteudo %}
  <section class="cartao cartao-login">
    <h1>Entrar</h1>
    <form method="post">
      {% csrf_token %}
      <div class="campo">
        <label for="id_username">Usuário</label>
        {{ form.username }}
      </div>
      <div class="campo">
        <label for="id_password">Senha</label>
        {{ form.password }}
      </div>
      {% if form.errors %}
        <p class="erro">Usuário ou senha inválidos.</p>
      {% endif %}
      <button type="submit" class="botao botao-primario">Entrar</button>
    </form>
    <p class="observacao">Contas são criadas pelo administrador do sistema.</p>
  </section>
{% endblock %}
