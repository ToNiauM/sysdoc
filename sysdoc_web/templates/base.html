{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SysDoc</title>
  <link rel="stylesheet" href="{% static 'sysdoc.css' %}">
</head>
<body>
  <header class="cabecalho">
    <span class="marca">SysDoc</span>
    {% if user.is_authenticated %}
      <nav class="conta">
        <span class="usuario">{{ user.get_username }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="botao-link">Sair</button>
        </form>
      </nav>
    {% endif %}
  </header>

  <main class="conteudo-principal">
    {% if messages %}
      <ul class="mensagens">
        {% for mensagem in messages %}
          <li class="mensagem mensagem-{{ mensagem.tags }}">{{ mensagem }}</li>
        {% endfor %}
      </ul>
    {% endif %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
