[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdoc"
version = "1.5.0"
description = "CLI IA-agnóstica para preparo, análise e geração determinística de documentos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "SEPAT/COLOG", email = "sepat@colog.mil.br" }
]
keywords = ["licitação", "contratação pública", "ETP", "TR", "análise jurídica", "IA", "CLI"]
dependencies = [
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]
web = [
    "django>=5.0,<6.0",
    "gunicorn>=22.0",
    "whitenoise>=6.6",
    "django-htmx>=1.17",
    "django-simple-history>=3.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[project.scripts]
sysdoc = "sysdoc:main"
sysdoc-dvi = "sysdoc_dvi.cli:main"

[tool.setuptools]
packages = [
    "core",
    "core.migrations",
    "core.templatetags",
    "sysdoc_dvi",
    "sysdoc_docx",
    "sysdoc_web",
    "sysdoc_web.processos",
    "sysdoc_web.processos.migrations",
    "sysdoc_web.processos.management",
    "sysdoc_web.processos.management.commands",
]
py-modules = ["sysdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
